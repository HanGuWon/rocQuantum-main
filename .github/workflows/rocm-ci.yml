name: ROCm CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      run_rocm_gpu:
        description: Run the self-hosted ROCm GPU evidence job
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: rocm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast Checks (CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: rocQuantum-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest numpy scipy "pyscf>=2.3"

      - name: Build and install host-only wheel
        run: |
          python -m build --wheel --outdir dist
          python -m pip install --force-reinstall dist/rocquantum-*.whl

      - name: Verify installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import rocq; import rocquantum"
          python -m rocq_cli --help

      - name: Run fast non-GPU tests
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/fast-checks
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          set -o pipefail
          python -m pytest -q tests test_bindings.py \
            --junitxml "${ARTIFACT_DIR}/junit-fast-checks.xml" \
            2>&1 | tee "${ARTIFACT_DIR}/pytest-fast-checks.log"

      - name: Write summary
        if: always()
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/fast-checks
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          {
            echo "# Fast Checks (CPU)"
            echo
            echo "- Result: ${{ job.status }}"
            echo "- Python: $(python --version)"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | tee "${ARTIFACT_DIR}/summary-fast-checks.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload fast-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-checks-${{ github.run_id }}
          path: ci-artifacts/fast-checks
          if-no-files-found: warn
          retention-days: 14

  mlir-compiler:
    name: Native Compiler (CPU, LLVM/MLIR 22.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: rocQuantum-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LLVM and MLIR 22.1
        run: |
          set -euo pipefail
          source /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-numpy llvm-22-dev libmlir-22-dev mlir-22-tools
          test "$(llvm-config-22 --version | cut -d. -f1,2)" = "22.1"

      - name: Configure compiler-only build
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/mlir-compiler
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACT_DIR}"
          cmake -S . -B build-mlir-compiler -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DROCQUANTUM_BUILD_NATIVE=OFF \
            -DROCQUANTUM_ENABLE_MLIR_COMPILER=ON \
            -DMLIR_DIR=/usr/lib/llvm-22/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            2>&1 | tee "${ARTIFACT_DIR}/configure.log"

      - name: Build compiler and tools
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/mlir-compiler
        run: |
          set -euo pipefail
          cmake --build build-mlir-compiler --parallel 2 \
            2>&1 | tee "${ARTIFACT_DIR}/build.log"

      - name: Verify static JIT, static/Base lowering, artifacts, cache, and QIR
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/mlir-compiler
        run: |
          set -euo pipefail
          ctest --test-dir build-mlir-compiler --output-on-failure \
            2>&1 | tee "${ARTIFACT_DIR}/ctest.log"

      - name: Verify installed compiler tools, CPU JIT, and Python offline API
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/mlir-compiler
          INSTALL_DIR: ${{ runner.temp }}/rocq-compiler-install
        run: |
          set -euo pipefail
          cmake --install build-mlir-compiler --prefix "${INSTALL_DIR}" \
            2>&1 | tee "${ARTIFACT_DIR}/install.log"
          test -x "${INSTALL_DIR}/bin/rocq-opt"
          test -x "${INSTALL_DIR}/bin/rocq-translate"
          test -x "${INSTALL_DIR}/bin/rocq-run"
          test ! -e "${INSTALL_DIR}/lib/libQuantumDialect.a"
          test ! -e "${INSTALL_DIR}/lib/libRocqQuantumToQIR.a"

          # The installed CPU runner executes verified static QIR through ORC/QIS.
          "${INSTALL_DIR}/bin/rocq-run" rocqCompiler/tests/bell_state.mlir \
            > "${ARTIFACT_DIR}/installed-bell.state.json"
          python3 - "${ARTIFACT_DIR}/installed-bell.state.json" <<'PY'
          import json
          import math
          import sys

          payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          assert payload["schema"] == "rocq-state-vector-v1"
          assert payload["backend"] == "cpu_statevec"
          assert payload["num_qubits"] == 2
          assert len(payload["amplitudes"]) == 4
          expected = 1.0 / math.sqrt(2.0)
          assert abs(payload["amplitudes"][0]["real"] - expected) < 1.0e-12
          assert abs(payload["amplitudes"][3]["real"] - expected) < 1.0e-12
          assert payload["amplitudes"][1] == {"real": 0, "imag": 0}
          assert payload["amplitudes"][2] == {"real": 0, "imag": 0}
          PY

          # Static-profile textual QIR remains the default installed-tool path.
          "${INSTALL_DIR}/bin/rocq-translate" \
            rocqCompiler/tests/bell.mlir > "${ARTIFACT_DIR}/installed-bell.qir.ll"
          /usr/lib/llvm-22/bin/llvm-as \
            "${ARTIFACT_DIR}/installed-bell.qir.ll" \
            -o "${ARTIFACT_DIR}/installed-bell.qir.bc"
          /usr/lib/llvm-22/bin/opt -passes=verify -disable-output \
            "${ARTIFACT_DIR}/installed-bell.qir.bc"

          # Exercise the installed Base Profile path and its terminal-result schema.
          "${INSTALL_DIR}/bin/rocq-translate" \
            --profile=qir-v2-base --emit=llvm-ir -O0 \
            -o "${ARTIFACT_DIR}/installed-base.qir.ll" \
            rocqCompiler/tests/base_profile.mlir
          /usr/lib/llvm-22/bin/llvm-as \
            "${ARTIFACT_DIR}/installed-base.qir.ll" \
            -o "${ARTIFACT_DIR}/installed-base.qir.bc"
          /usr/lib/llvm-22/bin/opt -passes=verify -disable-output \
            "${ARTIFACT_DIR}/installed-base.qir.bc"
          for marker in entry: body: measurements: output: \
            __quantum__qis__mz__body __quantum__rt__result_record_output; do
            grep -Fq "${marker}" "${ARTIFACT_DIR}/installed-base.qir.ll"
          done

          # Binary artifacts, deterministic cache hits, and unresolved QIR symbols.
          CACHE_DIR="${ARTIFACT_DIR}/installed-cache"
          "${INSTALL_DIR}/bin/rocq-translate" --emit=llvm-bc -O2 \
            --cache-dir "${CACHE_DIR}" --verbose \
            -o "${ARTIFACT_DIR}/installed-artifact-one.bc" \
            rocqCompiler/tests/artifact.mlir \
            2> "${ARTIFACT_DIR}/installed-cache-miss.log"
          "${INSTALL_DIR}/bin/rocq-translate" --emit=llvm-bc -O2 \
            --cache-dir "${CACHE_DIR}" --verbose \
            -o "${ARTIFACT_DIR}/installed-artifact-two.bc" \
            rocqCompiler/tests/artifact.mlir \
            2> "${ARTIFACT_DIR}/installed-cache-hit.log"
          grep -Fq "cache miss" "${ARTIFACT_DIR}/installed-cache-miss.log"
          grep -Fq "cache hit" "${ARTIFACT_DIR}/installed-cache-hit.log"
          cmp "${ARTIFACT_DIR}/installed-artifact-one.bc" \
            "${ARTIFACT_DIR}/installed-artifact-two.bc"
          /usr/lib/llvm-22/bin/opt -passes=verify -disable-output \
            "${ARTIFACT_DIR}/installed-artifact-one.bc"
          "${INSTALL_DIR}/bin/rocq-translate" --emit=object -O2 \
            -o "${ARTIFACT_DIR}/installed-artifact.o" \
            rocqCompiler/tests/artifact.mlir
          /usr/lib/llvm-22/bin/llvm-readobj --file-headers --symbols \
            "${ARTIFACT_DIR}/installed-artifact.o" \
            > "${ARTIFACT_DIR}/installed-artifact.readobj.txt"
          /usr/lib/llvm-22/bin/llvm-nm -u \
            "${ARTIFACT_DIR}/installed-artifact.o" \
            > "${ARTIFACT_DIR}/installed-artifact.undefined.txt"
          grep -Fq "__quantum__qis__h__body" \
            "${ARTIFACT_DIR}/installed-artifact.undefined.txt"

          PYTHONPATH="${PWD}" PATH="${INSTALL_DIR}/bin:${PATH}" python3 - <<'PY'
          import os
          from pathlib import Path

          import rocq

          kernel = rocq.QuantumKernel(lambda: rocq.h(rocq.qvec(1)[0]))
          kernel.name = "offline_python_qir"
          qir = kernel.qir()
          assert "__quantum__qis__h__body" in qir
          assert "qir_major_version" in qir
          assert rocq.compiler_capabilities()["qir_emission_kind"] == "rocq_translate_cli"
          Path(os.environ["ARTIFACT_DIR"], "python-cli.qir.ll").write_text(
              qir, encoding="utf-8"
          )

          builder = rocq.make_kernel()
          qubits = builder.qalloc(2)
          builder.h(qubits[0])
          builder.cx(qubits[0], qubits[1])
          measurements = builder.mz(qubits, "bits")
          assert measurements.qubits == (0, 1)
          base_qir = builder.qir(qir_profile="qir-v2-base")
          assert 'qir_profiles"="base_profile' in base_qir
          assert 'c"bits[0]\\00"' in base_qir
          assert 'c"bits[1]\\00"' in base_qir
          base_bc = builder.emit_artifact(
              kind="llvm-bc",
              optimization_level=0,
              qir_profile="qir-v2-base",
              cache_dir=Path(os.environ["ARTIFACT_DIR"], "python-base-cache"),
          )
          assert base_bc[:4] == b"BC\xc0\xde"
          caps = rocq.compiler_capabilities()
          assert caps["artifact_emission_available"]
          assert set(caps["artifact_kinds"]) == {"llvm-ir", "llvm-bc", "object"}
          Path(os.environ["ARTIFACT_DIR"], "python-base.qir.ll").write_text(
              base_qir, encoding="utf-8"
          )
          PY
          find "${INSTALL_DIR}" -maxdepth 2 -type f -printf '%P\n' \
            | sort | tee "${ARTIFACT_DIR}/install-manifest.txt"

      - name: Write compiler summary
        if: always()
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/mlir-compiler
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          {
            echo "# Native MLIR/LLVM/QIR Compiler"
            echo
            echo "- Result: ${{ job.status }}"
            echo "- LLVM: $(llvm-config-22 --version 2>/dev/null || echo unavailable)"
            echo "- GPU required: no"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | tee "${ARTIFACT_DIR}/summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload compiler artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlir-compiler-${{ github.run_id }}
          path: ci-artifacts/mlir-compiler
          if-no-files-found: warn
          retention-days: 14

  rocm-runtime-self-hosted:
    name: ROCm Runtime (Self-hosted GPU)
    needs: fast-checks
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_rocm_gpu) ||
      (vars.ROCQ_ENABLE_SELF_HOSTED_GPU == 'true' &&
       (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.fork == false))
    runs-on:
      - self-hosted
      - linux
      - x64
      - rocm
      - rocm-gpu
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: rocQuantum-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11 for native framework smoke
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture runner environment
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          {
            echo "timestamp_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uname -a
            cmake --version || true
            ninja --version || true
            python --version || true
            hipcc --version || true
            /opt/rocm/llvm/bin/clang++ --version || true
            rocminfo || true
            amd-smi list || true
            rocm-smi || true
            ls -l /dev/kfd || true
          } | tee "${ARTIFACT_DIR}/runner-env.log"

      - name: Probe ROCm runtime prerequisites
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          set -o pipefail
          bash scripts/probe_rocm_runtime.sh 2>&1 | tee "${ARTIFACT_DIR}/rocm-runtime-probe.log"

      - name: Export detected ROCm GPU architectures
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          set -euo pipefail
          GPU_ARCH="$(
            awk -F= '/^gpu_architectures=/ { value=$2 } END { print value }' \
              "${ARTIFACT_DIR}/rocm-runtime-probe.log"
          )"
          if [ -z "${GPU_ARCH}" ]; then
            echo "The ROCm probe did not report a GPU architecture." >&2
            exit 1
          fi
          echo "GPU_ARCH=${GPU_ARCH}" >> "${GITHUB_ENV}"
          echo "Detected ROCm GPU architecture(s): ${GPU_ARCH}" \
            | tee "${ARTIFACT_DIR}/gpu-architectures.log"

      - name: Async contract gate
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          set -o pipefail
          bash scripts/check_async_contract.sh 2>&1 | tee "${ARTIFACT_DIR}/async-contract.log"

      - name: Configure
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          set -o pipefail
          cmake -S . -B build-rocm-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DROCQUANTUM_BUILD_BINDINGS=OFF \
            -DROCQUANTUM_BUILD_NATIVE=ON \
            -DROCQUANTUM_REQUIRE_RCCL=ON \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_HIP_ARCHITECTURES="${GPU_ARCH}" \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            2>&1 | tee "${ARTIFACT_DIR}/configure.log"

      - name: Build
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          set -o pipefail
          cmake --build build-rocm-ci --parallel 2>&1 | tee "${ARTIFACT_DIR}/build.log"

      - name: Install native framework smoke dependencies
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          set -o pipefail
          mkdir -p "${ARTIFACT_DIR}"
          python -m venv --clear "${RUNNER_TEMP}/rocq-framework-venv"
          VENV_PYTHON="${RUNNER_TEMP}/rocq-framework-venv/bin/python"
          "${VENV_PYTHON}" -m pip install --upgrade pip \
            2>&1 | tee "${ARTIFACT_DIR}/native-framework-deps.log"
          "${VENV_PYTHON}" -m pip install \
            "numpy>=1.21" \
            scipy \
            pytest \
            pybind11 \
            "qiskit>=2.4,<3" \
            "pennylane>=0.45,<0.46" \
            "cirq-core>=1.0,<2" \
            2>&1 | tee -a "${ARTIFACT_DIR}/native-framework-deps.log"

      - name: Build native Python bindings for framework smoke
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          set -o pipefail
          VENV_PYTHON="${RUNNER_TEMP}/rocq-framework-venv/bin/python"
          PYBIND11_CMAKE_DIR="$("${VENV_PYTHON}" -m pybind11 --cmakedir)"
          cmake -S . -B build-rocm-python -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DROCQUANTUM_BUILD_BINDINGS=ON \
            -DROCQUANTUM_BUILD_NATIVE=ON \
            -DROCQUANTUM_REQUIRE_RCCL=ON \
            -DPython3_EXECUTABLE="${VENV_PYTHON}" \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_HIP_ARCHITECTURES="${GPU_ARCH}" \
            -DCMAKE_PREFIX_PATH="${PYBIND11_CMAKE_DIR};/opt/rocm" \
            2>&1 | tee "${ARTIFACT_DIR}/configure-native-framework.log"
          cmake --build build-rocm-python --parallel \
            2>&1 | tee "${ARTIFACT_DIR}/build-native-framework.log"

      - name: Run native framework integration smoke
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
          PYTHONPATH: ${{ github.workspace }}/rocQuantum-main:${{ github.workspace }}/rocQuantum-main/build-rocm-python:${{ github.workspace }}/rocQuantum-main/build-rocm-python/python/rocq:${{ github.workspace }}/rocQuantum-main/integrations/pennylane-rocq:${{ github.workspace }}/rocQuantum-main/integrations/qiskit-rocquantum-provider:${{ github.workspace }}/rocQuantum-main/integrations/cirq-rocm
        run: |
          set -o pipefail
          VENV_PYTHON="${RUNNER_TEMP}/rocq-framework-venv/bin/python"
          "${VENV_PYTHON}" scripts/native_framework_smoke.py \
            --json-output "${ARTIFACT_DIR}/native-framework-smoke.json" \
            --markdown-output "${ARTIFACT_DIR}/native-framework-smoke.md" \
            --require-native-rocm-evidence \
            2>&1 | tee "${ARTIFACT_DIR}/native-framework-smoke.log"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "${ARTIFACT_DIR}/native-framework-smoke.md" ]; then
            cat "${ARTIFACT_DIR}/native-framework-smoke.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Run ROCm runtime tests (1 GPU smoke)
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          set -o pipefail
          if ctest --help | grep -q -- "--output-junit"; then
            ctest --test-dir build-rocm-ci --output-on-failure --no-tests=error \
              --output-junit "${ARTIFACT_DIR}/ctest-runtime.junit.xml" \
              -L native -LE multi-gpu \
              2>&1 | tee "${ARTIFACT_DIR}/ctest-runtime.log"
          else
            ctest --test-dir build-rocm-ci --output-on-failure --no-tests=error -L native -LE multi-gpu \
              2>&1 | tee "${ARTIFACT_DIR}/ctest-runtime.log"
          fi

      - name: Run distributed MultiGPUTests when >= 2 GPUs
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          set -euo pipefail
          GPU_COUNT="$(
            awk -F= '/^visible_gpu_count=/ { value=$2 } END { print value }' \
              "${ARTIFACT_DIR}/rocm-runtime-probe.log"
          )"
          if [[ ! "${GPU_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "The ROCm probe did not report a valid GPU count." >&2
            exit 1
          fi
          if [ "${GPU_COUNT}" -ge 2 ]; then
            echo "Detected ${GPU_COUNT} GPUs; running MultiGPUTests." | tee "${ARTIFACT_DIR}/ctest-multigpu.log"
            if ctest --help | grep -q -- "--output-junit"; then
              ctest --test-dir build-rocm-ci --output-on-failure --no-tests=error \
                --output-junit "${ARTIFACT_DIR}/ctest-multigpu.junit.xml" \
                -R "MultiGPUTests" \
                2>&1 | tee -a "${ARTIFACT_DIR}/ctest-multigpu.log"
            else
              ctest --test-dir build-rocm-ci --output-on-failure --no-tests=error -R "MultiGPUTests" \
                2>&1 | tee -a "${ARTIFACT_DIR}/ctest-multigpu.log"
            fi
          else
            echo "Detected ${GPU_COUNT} GPU(s); skipping MultiGPUTests (need >=2)." | tee "${ARTIFACT_DIR}/ctest-multigpu.log"
          fi

      - name: Restore benchmark baseline
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ci-artifacts/benchmark-baseline/rocm-runtime
          key: benchmark-baseline-rocm-runtime-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            benchmark-baseline-rocm-runtime-${{ github.ref_name }}-
            benchmark-baseline-rocm-runtime-

      - name: Run release benchmark registry
        if: always()
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
          BASELINE_SUMMARY: ${{ github.workspace }}/ci-artifacts/benchmark-baseline/rocm-runtime/benchmark-summary.json
          HISTORY_PATH: ${{ github.workspace }}/ci-artifacts/benchmark-baseline/rocm-runtime/benchmark-history.json
        run: |
          set -o pipefail
          mkdir -p "${ARTIFACT_DIR}"
          BASELINE_ARGS=()
          if [ -f "${BASELINE_SUMMARY}" ]; then
            BASELINE_ARGS=(--baseline-summary "${BASELINE_SUMMARY}")
          fi
          python3 benchmarks/run_release_benchmarks.py \
            --build-dir build-rocm-ci \
            --output-dir "${ARTIFACT_DIR}/benchmark-artifacts" \
            "${BASELINE_ARGS[@]}" \
            --history-path "${HISTORY_PATH}" \
            --fail-on-error \
            --require-native-performance-evidence \
            2>&1 | tee "${ARTIFACT_DIR}/benchmark-runner.log"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "${ARTIFACT_DIR}/benchmark-artifacts/benchmark-summary.md" ]; then
            cat "${ARTIFACT_DIR}/benchmark-artifacts/benchmark-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Prepare benchmark baseline cache
        id: benchmark-baseline
        if: always()
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
          BASELINE_DIR: ${{ github.workspace }}/ci-artifacts/benchmark-baseline/rocm-runtime
        run: |
          mkdir -p "${BASELINE_DIR}"
          SUMMARY_JSON="${ARTIFACT_DIR}/benchmark-artifacts/benchmark-summary.json"
          if [ -f "${SUMMARY_JSON}" ] && python3 -c 'import json, sys; summary = json.load(open(sys.argv[1], encoding="utf-8")); ok = bool(summary.get("has_native_performance_evidence")) and not summary.get("native_performance_evidence_failure") and not summary.get("all_native_benchmark_evidence_failure"); raise SystemExit(0 if ok else 1)' "${SUMMARY_JSON}"; then
            cp "${SUMMARY_JSON}" "${BASELINE_DIR}/benchmark-summary.json"
            if [ -f "${BASELINE_DIR}/benchmark-history.json" ]; then
              cp "${BASELINE_DIR}/benchmark-history.json" "${ARTIFACT_DIR}/benchmark-artifacts/benchmark-history.json"
            fi
            echo "cacheable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Benchmark summary did not contain successful native performance evidence; skipping baseline cache."
            echo "cacheable=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save benchmark baseline
        if: always() && steps.benchmark-baseline.outputs.cacheable == 'true'
        uses: actions/cache/save@v4
        with:
          path: ci-artifacts/benchmark-baseline/rocm-runtime
          key: benchmark-baseline-rocm-runtime-${{ github.ref_name }}-${{ github.run_id }}

      - name: Write summary
        if: always()
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-runtime
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          {
            echo "# ROCm Runtime (Self-hosted GPU)"
            echo
            echo "- Result: ${{ job.status }}"
            echo "- Runner labels: self-hosted,linux,x64,rocm,rocm-gpu"
            echo "- Benchmark artifacts: ${ARTIFACT_DIR}/benchmark-artifacts"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | tee "${ARTIFACT_DIR}/summary-rocm-runtime.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocm-runtime-${{ github.run_id }}
          path: ci-artifacts/rocm-runtime
          if-no-files-found: warn
          retention-days: 14
