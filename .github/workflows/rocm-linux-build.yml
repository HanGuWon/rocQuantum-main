name: ROCm Linux Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    defaults:
      run:
        shell: bash
        working-directory: rocQuantum-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel --outdir dist
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("rocquantum-*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.endswith("-py3-none-any.whl"), wheel.name
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_path = next(name for name in names if name.endswith(".dist-info/WHEEL"))
              metadata = archive.read(metadata_path).decode("utf-8")
              assert "Root-Is-Purelib: true" in metadata, metadata
              assert "Tag: py3-none-any" in metadata, metadata
              forbidden = [
                  name for name in names
                  if name.endswith((".so", ".pyd", ".dll", ".cpp", ".hip", ".h", ".hpp"))
                  or "/src/" in name
                  or "/include/" in name
              ]
              assert not forbidden, forbidden
          PY
          python -m pip install --force-reinstall dist/rocquantum-*.whl
          python -m pip install scipy pytest boto3 "tomli>=2.0; python_version<'3.11'" \
            "qiskit>=2.4,<3; python_version>='3.10'" \
            "pennylane>=0.45,<0.46; python_version>='3.11'" "cirq-core>=1.0,<2"

      - name: Installability Smoke Test
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import rocq; import rocquantum"
          python -m rocq_cli --help

      - name: Run installed-wheel examples outside the source tree
        working-directory: ${{ runner.temp }}
        env:
          ROCQ_ENABLE_MOCK_BACKENDS: "1"
        run: |
          EXAMPLE_RUN_DIR="$(mktemp -d "${RUNNER_TEMP}/rocq-installed-examples.XXXXXX")"
          cp "${GITHUB_WORKSPACE}/rocQuantum-main/example.py" "${EXAMPLE_RUN_DIR}/"
          cp -R "${GITHUB_WORKSPACE}/rocQuantum-main/examples" "${EXAMPLE_RUN_DIR}/"
          EXAMPLE_COUNT=0
          while IFS= read -r script; do
            echo "Running ${script#${EXAMPLE_RUN_DIR}/}"
            (cd "${EXAMPLE_RUN_DIR}" && env -u PYTHONPATH python "${script}")
            EXAMPLE_COUNT=$((EXAMPLE_COUNT + 1))
          done < <(find "${EXAMPLE_RUN_DIR}" -type f -name '*.py' ! -name '_*.py' | sort)
          test "${EXAMPLE_COUNT}" -eq 19

      - name: Verify minimum Qiskit adapter import
        if: matrix.python-version == '3.10'
        run: |
          python -m venv "${RUNNER_TEMP}/rocq-qiskit-min"
          MIN_PYTHON="${RUNNER_TEMP}/rocq-qiskit-min/bin/python"
          "${MIN_PYTHON}" -m pip install --upgrade pip
          "${MIN_PYTHON}" -m pip install dist/rocquantum-*.whl "qiskit==2.4.0" pytest
          (cd "${RUNNER_TEMP}" && env -u PYTHONPATH "${MIN_PYTHON}" -c "import qiskit_rocquantum_provider")
          "${MIN_PYTHON}" -m pytest -q integrations/qiskit-rocquantum-provider/tests/test_backend.py

      - name: Verify minimum combined adapter contracts
        if: matrix.python-version == '3.11'
        run: |
          python -m venv "${RUNNER_TEMP}/rocq-adapters-min"
          MIN_PYTHON="${RUNNER_TEMP}/rocq-adapters-min/bin/python"
          "${MIN_PYTHON}" -m pip install --upgrade pip
          # Cirq < 1.5 constrains NumPy below 2, while PennyLane 0.45 requires
          # NumPy 2 or newer. Cirq 1.5 is the first co-installable floor.
          "${MIN_PYTHON}" -m pip install dist/rocquantum-*.whl \
            "qiskit==2.4.0" "pennylane==0.45.0" "cirq-core==1.5.0" \
            scipy pytest boto3
          (cd "${RUNNER_TEMP}" && env -u PYTHONPATH "${MIN_PYTHON}" -c \
            "import cirq_rocm, pennylane_rocq, qiskit_rocquantum_provider")
          "${MIN_PYTHON}" -m pytest -q \
            tests test_bindings.py \
            integrations/cirq-rocm/cirq_rocm/tests \
            integrations/qiskit-rocquantum-provider/tests \
            integrations/pennylane-rocq/tests

      - name: Run Unit Tests
        run: |
          TEST_PATHS=(
            tests
            test_bindings.py
            integrations/cirq-rocm/cirq_rocm/tests
          )
          if [ "${{ matrix.python-version }}" != "3.9" ]; then
            TEST_PATHS+=(integrations/qiskit-rocquantum-provider/tests)
          fi
          if [ "${{ matrix.python-version }}" != "3.9" ] && [ "${{ matrix.python-version }}" != "3.10" ]; then
            TEST_PATHS+=(integrations/pennylane-rocq/tests)
          fi
          python -m pytest -q "${TEST_PATHS[@]}"

  build:
    name: Build ROCm ${{ matrix.rocm_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rocm_image: rocm/dev-ubuntu-22.04:6.2.2
            rocm_label: "6.2.2"
            experimental: false
            hip_architectures: "gfx942;gfx90a"
          - rocm_image: rocm/dev-ubuntu-22.04:7.2.4
            rocm_label: "7.2.4"
            experimental: true
            hip_architectures: "gfx950;gfx942;gfx90a"
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-22.04
    container:
      image: ${{ matrix.rocm_image }}
    defaults:
      run:
        shell: bash
        working-directory: rocQuantum-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            cmake \
            hiprand-dev \
            libmetis-dev \
            ninja-build \
            python3-dev \
            python3-pip \
            python3-venv \
            ripgrep \
            rocblas-dev \
            rocrand-dev \
            rocsolver-dev
          python3 -m venv "${RUNNER_TEMP}/rocq-cmake-deps"
          CMAKE_DEPS_PYTHON="${RUNNER_TEMP}/rocq-cmake-deps/bin/python"
          "${CMAKE_DEPS_PYTHON}" -m pip install "pybind11==2.13.6"
          PYBIND11_CMAKE_DIR="$("${CMAKE_DEPS_PYTHON}" -m pybind11 --cmakedir)"
          test -f "${PYBIND11_CMAKE_DIR}/pybind11Config.cmake"
          echo "PYBIND11_CMAKE_DIR=${PYBIND11_CMAKE_DIR}" >> "${GITHUB_ENV}"

      - name: Async Contract Gate
        run: bash scripts/check_async_contract.sh

      - name: Configure
        env:
          CMAKE_PREFIX_PATH: /opt/rocm
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DROCQUANTUM_BUILD_NATIVE=ON \
            -Dpybind11_DIR="${PYBIND11_CMAKE_DIR}" \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_HIP_ARCHITECTURES="${{ matrix.hip_architectures }}"

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Validate CMake install-tree consumer
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-linux-build-${{ matrix.rocm_label }}
          CMAKE_PREFIX_PATH: /opt/rocm
        run: |
          set -o pipefail
          mkdir -p "${ARTIFACT_DIR}"
          export CMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++
          export CMAKE_HIP_ARCHITECTURES="${{ matrix.hip_architectures }}"
          export ROCQUANTUM_INSTALL_PREFIX="${ARTIFACT_DIR}/install-prefix"
          export ROCQUANTUM_INSTALL_CONSUMER_BUILD_DIR="${ARTIFACT_DIR}/install-consumer-build"
          bash scripts/validate_cmake_install_consumer.sh build-ci \
            2>&1 | tee "${ARTIFACT_DIR}/cmake-install-consumer.log"

      - name: Build C128 precision lane with METIS and validate installed ABI contract
        if: matrix.rocm_label == '6.2.2'
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-linux-build-${{ matrix.rocm_label }}
          CMAKE_PREFIX_PATH: /opt/rocm
        run: |
          set -o pipefail
          cmake -S . -B build-c128 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DROCQUANTUM_BUILD_BINDINGS=ON \
            -DROCQUANTUM_BUILD_NATIVE=ON \
            -DROCQ_PRECISION_DOUBLE=ON \
            -DROCQUANTUM_TENSORNET_ENABLE_METIS=ON \
            -Dpybind11_DIR="${PYBIND11_CMAKE_DIR}" \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_HIP_ARCHITECTURES="${{ matrix.hip_architectures }}"
          cmake --build build-c128 --parallel
          export CMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++
          export CMAKE_HIP_ARCHITECTURES="${{ matrix.hip_architectures }}"
          export ROCQUANTUM_INSTALL_PREFIX="${ARTIFACT_DIR}/install-prefix-c128"
          export ROCQUANTUM_INSTALL_CONSUMER_BUILD_DIR="${ARTIFACT_DIR}/install-consumer-build-c128"
          bash scripts/validate_cmake_install_consumer.sh build-c128 \
            2>&1 | tee "${ARTIFACT_DIR}/cmake-install-consumer-c128.log"

      - name: Build and import installed native wheel outside the source tree
        if: matrix.rocm_label == '6.2.2'
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-linux-build-${{ matrix.rocm_label }}
          ROCQ_BUILD_NATIVE: "1"
          CMAKE_PREFIX_PATH: /opt/rocm
          CMAKE_ARGS: >-
            -DROCQUANTUM_BUILD_NATIVE=ON
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++
            -DCMAKE_HIP_ARCHITECTURES=gfx90a
        run: |
          set -euo pipefail
          python3 -m venv "${ARTIFACT_DIR}/native-wheel-build-venv"
          BUILD_PYTHON="${ARTIFACT_DIR}/native-wheel-build-venv/bin/python"
          "${BUILD_PYTHON}" -m pip install --upgrade \
            build pip scikit-build-core "pybind11==2.13.6"
          PYBIND11_CMAKE_DIR="$("${BUILD_PYTHON}" -m pybind11 --cmakedir)"
          BASE_CMAKE_ARGS="${CMAKE_ARGS}"
          export CMAKE_ARGS="${BASE_CMAKE_ARGS} -DCMAKE_PREFIX_PATH=${PYBIND11_CMAKE_DIR};/opt/rocm"
          "${BUILD_PYTHON}" -m build --wheel --outdir "${ARTIFACT_DIR}/native-wheel"
          python3 -m venv "${ARTIFACT_DIR}/native-wheel-venv"
          WHEEL_PYTHON="${ARTIFACT_DIR}/native-wheel-venv/bin/python"
          "${WHEEL_PYTHON}" -m pip install "${ARTIFACT_DIR}"/native-wheel/rocquantum-*.whl
          SITE_PACKAGES="$("${WHEEL_PYTHON}" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          if [ -d "${SITE_PACKAGES}/lib" ]; then
            WHEEL_LIB_DIR="${SITE_PACKAGES}/lib"
          elif [ -d "${SITE_PACKAGES}/lib64" ]; then
            WHEEL_LIB_DIR="${SITE_PACKAGES}/lib64"
          else
            echo "Installed native wheel has no lib/lib64 component directory" >&2
            exit 1
          fi
          for library in libhipStateVec.so librocqsim_tensornet.so librocq_hip_density_mat.so; do
            test -f "${WHEEL_LIB_DIR}/${library}"
          done
          mapfile -t EXTENSIONS < <(find "${SITE_PACKAGES}" -maxdepth 1 -type f \
            \( -name 'rocquantum_bind*.so' -o -name 'rocq_hip*.so' -o -name '_rocq_hip_backend*.so' \) | sort)
          test "${#EXTENSIONS[@]}" -eq 3
          for extension in "${EXTENSIONS[@]}"; do
            readelf -d "${extension}" | tee -a "${ARTIFACT_DIR}/native-wheel-readelf.log"
            readelf -d "${extension}" | grep -E '(RPATH|RUNPATH).*\$ORIGIN/(lib|lib64)'
            LDD_OUTPUT="$(ldd "${extension}")"
            printf '%s\n' "${LDD_OUTPUT}" | tee -a "${ARTIFACT_DIR}/native-wheel-ldd.log"
            if grep -q 'not found' <<< "${LDD_OUTPUT}"; then
              echo "Unresolved installed-wheel dependency for ${extension}" >&2
              exit 1
            fi
          done
          for library in libhipStateVec.so librocqsim_tensornet.so librocq_hip_density_mat.so; do
            grep -F "${WHEEL_LIB_DIR}/${library}" "${ARTIFACT_DIR}/native-wheel-ldd.log"
          done
          (
            cd "${RUNNER_TEMP}"
            env -u PYTHONPATH "${WHEEL_PYTHON}" - <<'PY'
          import numpy as np
          import _rocq_hip_backend
          import rocq_hip
          import rocquantum_bind

          assert _rocq_hip_backend.COMPILED_COMPLEX_DTYPE == "complex64"
          assert _rocq_hip_backend.COMPILED_COMPLEX_ITEMSIZE == 8
          assert rocquantum_bind.COMPILED_COMPLEX_DTYPE == "complex64"
          assert rocquantum_bind.COMPILED_COMPLEX_ITEMSIZE == 8
          result = _rocq_hip_backend._compiled_complex_roundtrip(
              np.asarray([1 + 2j], dtype=np.complex64)
          )
          assert result.dtype == np.dtype("complex64")
          assert result.tolist() == [1 + 2j]
          PY
          )

          export CMAKE_ARGS="${BASE_CMAKE_ARGS} -DROCQ_PRECISION_DOUBLE=ON -DCMAKE_PREFIX_PATH=${PYBIND11_CMAKE_DIR};/opt/rocm"
          "${BUILD_PYTHON}" -m build --wheel --outdir "${ARTIFACT_DIR}/native-wheel-c128"
          python3 -m venv "${ARTIFACT_DIR}/native-wheel-c128-venv"
          C128_PYTHON="${ARTIFACT_DIR}/native-wheel-c128-venv/bin/python"
          "${C128_PYTHON}" -m pip install "${ARTIFACT_DIR}"/native-wheel-c128/rocquantum-*.whl
          (
            cd "${RUNNER_TEMP}"
            env -u PYTHONPATH "${C128_PYTHON}" - <<'PY'
          import numpy as np
          import _rocq_hip_backend
          import rocq.backends
          import rocq_hip
          import rocquantum_bind

          assert _rocq_hip_backend.COMPILED_COMPLEX_DTYPE == "complex128"
          assert _rocq_hip_backend.COMPILED_COMPLEX_ITEMSIZE == 16
          assert rocquantum_bind.COMPILED_COMPLEX_DTYPE == "complex128"
          assert rocquantum_bind.COMPILED_COMPLEX_ITEMSIZE == 16
          assert rocq.backends._statevector_complex_dtype() == np.dtype("complex128")
          result = _rocq_hip_backend._compiled_complex_roundtrip(
              np.asarray([1 + 2j], dtype=np.complex128)
          )
          assert result.dtype == np.dtype("complex128")
          assert result.tolist() == [1 + 2j]
          PY
          )

      - name: Run native single-GPU regressions when a device is present
        run: |
          if [ ! -e /dev/kfd ]; then
            echo "No ROCm runtime device detected. Skipping GPU runtime tests."
            exit 0
          fi
          ctest --test-dir build-ci --output-on-failure --no-tests=error -L native -LE multi-gpu

      - name: Run release benchmark registry
        if: always()
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts/rocm-linux-build-${{ matrix.rocm_label }}
        run: |
          set -o pipefail
          mkdir -p "${ARTIFACT_DIR}"
          python3 benchmarks/run_release_benchmarks.py \
            --build-dir build-ci \
            --output-dir "${ARTIFACT_DIR}/benchmark-artifacts" \
            --fail-on-error \
            2>&1 | tee "${ARTIFACT_DIR}/benchmark-runner.log"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "${ARTIFACT_DIR}/benchmark-artifacts/benchmark-summary.md" ]; then
            cat "${ARTIFACT_DIR}/benchmark-artifacts/benchmark-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload ROCm build benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocm-linux-build-${{ matrix.rocm_label }}-${{ github.run_id }}
          path: ci-artifacts/rocm-linux-build-${{ matrix.rocm_label }}
          if-no-files-found: warn
          retention-days: 14
