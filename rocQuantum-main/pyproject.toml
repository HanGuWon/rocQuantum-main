[build-system]
requires = ["scikit-build-core>=0.11.0", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "rocquantum"
version = "0.1.0"
description = "A hardware-agnostic quantum computing framework for AMD GPUs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["quantum", "computing", "rocm", "amd", "gpu", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.21", "requests>=2.28"]

[project.optional-dependencies]
backends = ["requests>=2.28", "boto3>=1.26"]
pennylane = ["pennylane>=0.45,<0.46; python_version >= '3.11'"]
qiskit = ["qiskit>=2.4,<3; python_version >= '3.10'"]
cirq = ["cirq-core>=1.0,<2"]
solvers = ["scipy>=1.10"]
dev = ["pytest>=7.0", "numpy>=1.21", "tomli>=2.0; python_version < '3.11'"]
all = ["rocquantum[backends,pennylane,qiskit,cirq,solvers,dev]"]

[project.scripts]
rocq = "rocq_cli:main"

[project.entry-points."pennylane.plugins"]
"rocquantum.qpu" = "pennylane_rocq:RocQDevice"
"rocq.pennylane" = "pennylane_rocq:RocqDevice"
"lightning.rocq" = "pennylane_rocq:LightningRocqDevice"
"lightning.rocm" = "pennylane_rocq:LightningRocmDevice"

[project.entry-points."qiskit.providers"]
rocquantum = "qiskit_rocquantum_provider:RocQuantumProvider"

[tool.scikit-build]
cmake.version = ">=3.21"
cmake.define.ROCQUANTUM_BUILD_NATIVE = "OFF"
wheel.platlib = false
wheel.py-api = "py3"
wheel.exclude = [
    "rocquantum/CMakeLists.txt",
    "rocquantum/include/**",
    "rocquantum/src/**",
    "rocquantum/tests/**",
]

[tool.scikit-build.wheel.packages]
rocq = "rocq"
rocquantum = "rocquantum"
qiskit_rocquantum_provider = "integrations/qiskit-rocquantum-provider/qiskit_rocquantum_provider"
pennylane_rocq = "integrations/pennylane-rocq/pennylane_rocq"
cirq_rocm = "integrations/cirq-rocm/cirq_rocm"

[[tool.scikit-build.overrides]]
if.env.ROCQ_BUILD_NATIVE = true
wheel.platlib = true
wheel.py-api = ""
cmake.define.ROCQUANTUM_BUILD_NATIVE = "ON"
